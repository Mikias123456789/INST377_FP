<html>
<head>
    <title>Weather</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightblue;
        }

        .header {
            padding: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        nav {
            background-color: #b0b0b0;
            padding: 10px;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 20px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li {
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        nav li:hover {
            background-color: lightblue;
        }

        .title {
            font-size: 28px;
            margin: 20px;
            font-weight: bold;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px;
        }

        .row1 {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .row2 {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .weather-box {
            padding: 15px;
            background: white;
            border: 2px solid black;
            width: 350px;
        }

        .saved-box {
            padding: 15px;
            background: white;
            border: 2px solid black;
            width: 350px;
        }

        .hourly-box {
            padding: 15px;
            background: white;
            border: 2px solid black;
            width: 350px;
        }

        .chart-box {
            padding: 15px;
            background: white;
            border: 2px solid black;
            width: 500px;
        }

        .search-box {
            margin: 20px;
            padding: 15px;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        .button {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background-color: #1e8449;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .button:hover {
            background-color: #145a32;
        }

        .saved-item {
            cursor: pointer;
            padding: 5px;
        }

        .saved-item:hover {
            background-color: lightgray;
        }

        #map {
            height: 300px;
            width: 350px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

<div class="header">Weather Application</div>

<nav>
    <ul>
        <li onclick="goPage('Test2_Home_Page_FP.html')">Home</li>
        <li onclick="goPage('Test2_About_Page_FP.html')">About</li>
        <li onclick="goPage('Test2_Weather_Page_FP.html')">Weather</li>
    </ul>
</nav>

<div class="title">Weather Details</div>

<div class="search-box">
    <input type="text" id="cityInput" placeholder="Enter city">
    <button class="button" onclick="searchCity()">Search</button>
</div>

<div class="main-container">

    <div class="row1">
        <div id="map"></div>

        <div class="chart-box">
            <h3>Temperature Chart (Next 6 Hours)</h3>
            <canvas id="tempChart"></canvas>
        </div>

        <div class="hourly-box">
            <h3>Hourly Temperature (Next 6 Hours)</h3>
            <p id="hourly">Loading...</p>
        </div>
    </div>

    <div class="row2">

        <div class="weather-box">
            <h3>Current Weather</h3>
            <p id="currentWeather">Loading...</p>
        </div>

        <div class="saved-box">
            <h3>Saved Cities</h3>
            <div id="savedCities">Loading...</div>
        </div>

    </div>

</div>

<button class="button" onclick="goPage('Test2_Home_Page_FP.html')">
    Back to Home
</button>

<script>
function goPage(page) {
    window.location.href = page;
}

const map = L.map('map').setView([38.98, -76.94], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

function addMarker(lat, lon, city) {
    L.marker([lat, lon])
        .addTo(map)
        .bindPopup(city)
        .on('click', function () {
            loadWeather(lat, lon, city);
        });
}

function getCondition(code) {
    if (code === 0) return "Clear";
    if (code <= 3) return "Cloudy";
    if (code >= 45 && code <= 48) return "Fog";
    if (code >= 51 && code <= 67) return "Rain";
    if (code >= 71 && code <= 77) return "Snow";
    if (code >= 80 && code <= 99) return "Showers/Storms";
    return "Unknown";
}

function loadSavedCities() {
    fetch(`${window.location.origin}/cities`)
        .then(res => res.json())
        .then(data => {
            let html = "";

            data.forEach(c => {
                html += `<div class="saved-item" onclick="loadWeather(${c.lat}, ${c.lon}, '${c.city}')">${c.city}</div>`;
                addMarker(c.lat, c.lon, c.city);
            });

            document.getElementById("savedCities").innerHTML = html || "No saved cities";
        })
        .catch(() => {
            document.getElementById("savedCities").innerHTML = "Failed to load";
        });
}

function saveCity(city, lat, lon) {
    fetch(`${window.location.origin}/cities`)
        .then(res => res.json())
        .then(data => {

            const exists = data.some(c =>
                c.city.toLowerCase() === city.toLowerCase()
            );

            if (!exists) {
                fetch(`${window.location.origin}/cities`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ city, lat, lon })
                })
                .then(() => {
                    loadSavedCities();
                });
            }
        });
}

function loadWeather(lat, lon, cityName) {
    fetch(`${window.location.origin}/weather?lat=` + lat + "&lon=" + lon)
        .then(res => res.json())
        .then(data => {

            const w = data.current_weather;

            const tempC = w.temperature;
            const tempF = (tempC * 9/5) + 32;

            const times = data.hourly.time;
            const temps = data.hourly.temperature_2m;
            const feels = data.hourly.apparent_temperature;

            const currentTime = new Date(w.time).getTime();

            let startIndex = times.findIndex(t => new Date(t).getTime() >= currentTime);
            if (startIndex === -1) startIndex = 0;

            const feelsC = feels[startIndex];
            const feelsF = (feelsC * 9/5) + 32;

            document.getElementById("currentWeather").innerHTML =
                (cityName ? cityName + "<br>" : "") +
                "Temp: " + tempF.toFixed(1) + "°F / " + tempC + "°C<br>" +
                "Feels Like: " + feelsF.toFixed(1) + "°F / " + feelsC + "°C<br>" +
                "Condition: " + getCondition(w.weathercode) + "<br>" +
                "Wind: " + w.windspeed + " km/h<br>" +
                "Direction: " + w.winddirection + "°";

            let hourlyText = "";
            let chartLabels = [];
            let chartData = [];

            for (let i = 1; i <= 6; i++) {

                const idx = startIndex + i;
                if (!times[idx]) break;

                const date = new Date(times[idx]);
                let hour = date.getHours();
                let suffix = hour >= 12 ? "PM" : "AM";

                if (hour === 0) hour = 12;
                else if (hour > 12) hour -= 12;

                const tempC2 = temps[idx];
                const tempF2 = (tempC2 * 9/5) + 32;

                hourlyText += hour + " " + suffix + " - " +
                    tempF2.toFixed(1) + "°F / " + tempC2 + "°C<br>";

                chartLabels.push(hour + " " + suffix);
                chartData.push(tempF2);
            }

            document.getElementById("hourly").innerHTML = hourlyText;

            if (window.myChart) window.myChart.destroy();

            const ctx = document.getElementById("tempChart");

            window.myChart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: "Temperature (°F)",
                        data: chartData,
                        borderWidth: 2,
                        fill: false
                    }]
                }
            });

            saveCity(cityName, lat, lon);
        })
        .catch(() => {
            document.getElementById("currentWeather").innerHTML = "Weather data unavailable";
            document.getElementById("hourly").innerHTML = "";
        });
}

function searchCity() {
    const city = document.getElementById("cityInput").value;

    fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + city + "&count=1&language=en&format=json")
        .then(res => res.json())
        .then(data => {

            if (!data.results || data.results.length === 0) {
                document.getElementById("currentWeather").innerHTML = "City not found";
                document.getElementById("hourly").innerHTML = "";
                return;
            }

            const loc = data.results[0];
            addMarker(loc.latitude, loc.longitude, loc.name);
            map.setView([loc.latitude, loc.longitude], 10);
            loadWeather(loc.latitude, loc.longitude, loc.name);
        })
        .catch(() => {
            document.getElementById("currentWeather").innerHTML = "Error finding city";
        });
}

loadSavedCities();
loadWeather(38.98, -76.94, "College Park");
</script>

</body>
</html>
